apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.uat.yml -c
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: api
  name: api
spec:
  replicas: {{ .Values.deployments.api.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: api
  strategy:
    type: {{ .Values.deployments.api.strategy.type }}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.uat.yml -c
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: api
        {{- if .Values.deployments.api.azureWorkloadIdentity }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if or .Values.deployments.api.serviceAccountName .Values.global.serviceAccount.name }}
      serviceAccountName: {{ .Values.deployments.api.serviceAccountName | default .Values.global.serviceAccount.name | quote }}
      {{- end }}
      initContainers:
        - name: run-db-migrations
          image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
          command: {{ .Values.deployments.api.initContainers.dbMigrations.command | toYaml | nindent 12 }}
          env:
            - name: DB_ENCRYPT_CONNECTION
              {{- if .Values.deployments.api.env.DB_ENCRYPT_CONNECTION }}
              value: {{ .Values.deployments.api.env.DB_ENCRYPT_CONNECTION | quote }}
              {{- else }}
              value: "true"
              {{- end }}
            - name: POSTGRES_DB
              {{- if .Values.deployments.api.env.POSTGRES_DB }}
              value: {{ .Values.deployments.api.env.POSTGRES_DB | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_DB_UAT
              {{- end }}
            - name: POSTGRES_HOST
              {{- if .Values.deployments.api.env.POSTGRES_HOST }}
              value: {{ .Values.deployments.api.env.POSTGRES_HOST | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_HOST_UAT
              {{- end }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.deployments.api.env.POSTGRES_PASSWORD }}
              value: {{ .Values.deployments.api.env.POSTGRES_PASSWORD | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_PASSWORD_UAT
              {{- end }}
            - name: POSTGRES_USER
              {{- if .Values.deployments.api.env.POSTGRES_USER }}
              value: {{ .Values.deployments.api.env.POSTGRES_USER | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_USER_UAT
              {{- end }}
          imagePullPolicy: IfNotPresent
      containers:
        - name: api
          image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
          env:
            # Analytics - from secret or value
            - name: ANALYTICS_ADMIN_PASSWORD
              {{- if .Values.deployments.api.env.ANALYTICS_ADMIN_PASSWORD }}
              value: {{ .Values.deployments.api.env.ANALYTICS_ADMIN_PASSWORD | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: ANALYTICS_ADMIN_PASSWORD_UAT
              {{- end }}
            - name: ANALYTICS_API_URL
              {{- if .Values.deployments.api.env.ANALYTICS_API_URL }}
              value: {{ .Values.deployments.api.env.ANALYTICS_API_URL | quote }}
              {{- else }}
              value: "http://analytics:3000/api"
              {{- end }}
            
            # Auth0 - from secret or value
            - name: AUTH0_AUDIENCE
              {{- if .Values.deployments.api.env.AUTH0_AUDIENCE }}
              value: {{ .Values.deployments.api.env.AUTH0_AUDIENCE | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_AUDIENCE_UAT
              {{- end }}
            - name: AUTH0_CLIENT_ID
              {{- if .Values.deployments.api.env.AUTH0_CLIENT_ID }}
              value: {{ .Values.deployments.api.env.AUTH0_CLIENT_ID | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_CLIENT_ID_API_UAT
              {{- end }}
            - name: AUTH0_CLIENT_SECRET
              {{- if .Values.deployments.api.env.AUTH0_CLIENT_SECRET }}
              value: {{ .Values.deployments.api.env.AUTH0_CLIENT_SECRET | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_CLIENT_SECRET_API_UAT
              {{- end }}
            - name: AUTH0_ISSUER_URL
              {{- if .Values.deployments.api.env.AUTH0_ISSUER_URL }}
              value: {{ .Values.deployments.api.env.AUTH0_ISSUER_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_ISSUER_URL_API_UAT
              {{- end }}
            
            # Azure Storage - from secret or value
            - name: AZURE_STORAGE_CONNECTION_STRING
              {{- if .Values.deployments.api.env.AZURE_STORAGE_CONNECTION_STRING }}
              value: {{ .Values.deployments.api.env.AZURE_STORAGE_CONNECTION_STRING | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AZURE_STORAGE_CONNECTION_STRING_UAT
              {{- end }}
            
            # Base URL - from secret or value
            - name: BASE_URL
              {{- if .Values.deployments.api.env.BASE_URL }}
              value: {{ .Values.deployments.api.env.BASE_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: BASE_URL_UAT
              {{- end }}
            
            # Config paths - use values (hardcoded or override)
            - name: CONFIG_FOLDER
              value: {{ .Values.deployments.api.env.CONFIG_FOLDER | quote }}
            
            # Data endpoints - use values (hardcoded or override)
            - name: DATA_INGESTION_URL
              value: {{ .Values.deployments.api.env.DATA_INGESTION_URL | quote }}
            - name: DATA_VALIDATION_URL
              value: {{ .Values.deployments.api.env.DATA_VALIDATION_URL | quote }}
            
            # DOI Configuration - from secret or value
            - name: DOI_ENVIRONMENT
              {{- if .Values.deployments.api.env.DOI_ENVIRONMENT }}
              value: {{ .Values.deployments.api.env.DOI_ENVIRONMENT | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DOI_ENVIRONMENT_UAT
              {{- end }}
            - name: DOI_PUBLISHER
              {{- if .Values.deployments.api.env.DOI_PUBLISHER }}
              value: {{ .Values.deployments.api.env.DOI_PUBLISHER | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DOI_PUBLISHER_UAT
              {{- end }}
            - name: DOI_RESOLVER_BASE_URL
              {{- if .Values.deployments.api.env.DOI_RESOLVER_BASE_URL }}
              value: {{ .Values.deployments.api.env.DOI_RESOLVER_BASE_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DOI_RESOLVER_BASE_URL_UAT
              {{- end }}
            
            # Datacite Configuration - from secret or value
            - name: DATACITE_PASSWORD
              {{- if .Values.deployments.api.env.DATACITE_PASSWORD }}
              value: {{ .Values.deployments.api.env.DATACITE_PASSWORD | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DATACITE_PASSWORD_UAT
              {{- end }}
            - name: DATACITE_PREFIX
              {{- if .Values.deployments.api.env.DATACITE_PREFIX }}
              value: {{ .Values.deployments.api.env.DATACITE_PREFIX | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DATACITE_PREFIX_UAT
              {{- end }}
            - name: DATACITE_URL
              {{- if .Values.deployments.api.env.DATACITE_URL }}
              value: {{ .Values.deployments.api.env.DATACITE_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DATACITE_URL_UAT
              {{- end }}
            - name: DATACITE_USER
              {{- if .Values.deployments.api.env.DATACITE_USER }}
              value: {{ .Values.deployments.api.env.DATACITE_USER | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: DATACITE_USER_UAT
              {{- end }}
            
            # Email Configuration - from secret or value
            - name: EMAIL_FROM
              {{- if .Values.deployments.api.env.EMAIL_FROM }}
              value: {{ .Values.deployments.api.env.EMAIL_FROM | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: EMAIL_FROM_UAT
              {{- end }}
            - name: EMAIL_HOST
              {{- if .Values.deployments.api.env.EMAIL_HOST }}
              value: {{ .Values.deployments.api.env.EMAIL_HOST | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: EMAIL_HOST_UAT
              {{- end }}
            - name: EMAIL_PASSWORD
              {{- if .Values.deployments.api.env.EMAIL_PASSWORD }}
              value: {{ .Values.deployments.api.env.EMAIL_PASSWORD | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: EMAIL_PASSWORD_UAT
              {{- end }}
            - name: EMAIL_PORT
              {{- if .Values.deployments.api.env.EMAIL_PORT }}
              value: {{ .Values.deployments.api.env.EMAIL_PORT | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: EMAIL_PORT_UAT
              {{- end }}
            - name: EMAIL_SECURE
              {{- if .Values.deployments.api.env.EMAIL_SECURE }}
              value: {{ .Values.deployments.api.env.EMAIL_SECURE | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: EMAIL_SECURE_UAT
              {{- end }}
            
            # File Storage Type - from secret or value
            - name: FILE_STORAGE_TYPE
              {{- if .Values.deployments.api.env.FILE_STORAGE_TYPE }}
              value: {{ .Values.deployments.api.env.FILE_STORAGE_TYPE | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: FILE_STORAGE_TYPE_UAT
              {{- end }}
            
            # IMAP Configuration - from secret or value
            - name: IMAP_PORT
              {{- if .Values.deployments.api.env.IMAP_PORT }}
              value: {{ .Values.deployments.api.env.IMAP_PORT | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: IMAP_PORT_UAT
              {{- end }}
            - name: IMAP_SERVER
              {{- if .Values.deployments.api.env.IMAP_SERVER }}
              value: {{ .Values.deployments.api.env.IMAP_SERVER | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: IMAP_SERVER_UAT
              {{- end }}
            
            # Public IDs - use values (hardcoded or override)
            - name: NEXT_PUBLIC_ANALYTICS_ID
              {{- if .Values.deployments.api.env.NEXT_PUBLIC_ANALYTICS_ID }}
              value: {{ .Values.deployments.api.env.NEXT_PUBLIC_ANALYTICS_ID | quote }}
              {{- else }}
              value: "2b3b6da0-3e75-4d9e-be86-d588496a174e"
              {{- end }}
            - name: NEXT_PUBLIC_AUTH_ENDPOINT
              value: {{ .Values.deployments.api.env.NEXT_PUBLIC_AUTH_ENDPOINT | quote }}
            
            # File Paths - use values (hardcoded or override)
            - name: OVERLAY_BLOB_FOLDER
              value: {{ .Values.deployments.api.env.OVERLAY_BLOB_FOLDER | quote }}
            - name: PUBLIC_FOLDER
              value: {{ .Values.deployments.api.env.PUBLIC_FOLDER | quote }}
            - name: DATA_TEMPLATES_FOLDER
              value: {{ .Values.deployments.api.env.DATA_TEMPLATES_FOLDER | quote }}
            - name: TILESERVER_DATA_FOLDER
              value: {{ .Values.deployments.api.env.TILESERVER_DATA_FOLDER | quote }}
            - name: FULL_OCCURRENCE_DATA_FOLDER
              value: {{ .Values.deployments.api.env.FULL_OCCURRENCE_DATA_FOLDER | quote }}
            
            # PostgreSQL Connection - from secret or value
            - name: POSTGRES_DB
              {{- if .Values.deployments.api.env.POSTGRES_DB }}
              value: {{ .Values.deployments.api.env.POSTGRES_DB | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_DB_UAT
              {{- end }}
            - name: POSTGRES_HOST
              {{- if .Values.deployments.api.env.POSTGRES_HOST }}
              value: {{ .Values.deployments.api.env.POSTGRES_HOST | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_HOST_UAT
              {{- end }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.deployments.api.env.POSTGRES_PASSWORD }}
              value: {{ .Values.deployments.api.env.POSTGRES_PASSWORD | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_PASSWORD_UAT
              {{- end }}
            - name: POSTGRES_USER
              {{- if .Values.deployments.api.env.POSTGRES_USER }}
              value: {{ .Values.deployments.api.env.POSTGRES_USER | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: POSTGRES_USER_UAT
              {{- end }}
            
            # Redis Connection - use values (hardcoded or override)
            - name: REDIS_HOST
              value: {{ .Values.deployments.api.env.REDIS_HOST | quote }}
            - name: REDIS_PORT
              value: {{ .Values.deployments.api.env.REDIS_PORT | quote }}
            
            # Secret Folders - from secret or value
            - name: SENT_EMAIL_FOLDER
              {{- if .Values.deployments.api.env.SENT_EMAIL_FOLDER }}
              value: {{ .Values.deployments.api.env.SENT_EMAIL_FOLDER | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: SENT_EMAIL_FOLDER_UAT
              {{- end }}
            - name: TEMP_DIR
              {{- if .Values.deployments.api.env.TEMP_DIR }}
              value: {{ .Values.deployments.api.env.TEMP_DIR | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: TEMP_DIR_UAT
              {{- end }}
            
            # Token - from secret or value
            - name: TOKEN_KEY
              {{- if .Values.deployments.api.env.TOKEN_KEY }}
              value: {{ .Values.deployments.api.env.TOKEN_KEY | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: TOKEN_KEY_UAT
              {{- end }}
          volumeMounts:
            - mountPath: /usr/src/app/dist/public
              name: api-claim0
            - mountPath: /etc/vector-atlas/api
              name: api-claim1
            - mountPath: /data
              name: api-claim2
            - mountPath: /occurrence_data
              name: occurrencegeojob-claim
      restartPolicy: Always
      volumes:
        - name: api-claim0
          persistentVolumeClaim:
            claimName: pvc-public
        - name: api-claim1
          persistentVolumeClaim:
            claimName: pvc-api
        - name: api-claim2
          persistentVolumeClaim:
            claimName: pvc-data
        - name: occurrencegeojob-claim
          persistentVolumeClaim:
            claimName: pvc-occurrencedata
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
