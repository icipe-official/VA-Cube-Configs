apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name | lower }}-api-route
  namespace: {{ .Values.global.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      namespace: {{ .Values.ingress.gateway.namespace }}
      sectionName: {{ .Values.ingress.gateway.section }}
  hostnames:
    - {{ .Values.ingress.routes.api.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.routes.api.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .Values.ingress.routes.api.stripPrefix | quote }}
      backendRefs:
        - name: {{ .Values.ingress.routes.api.backend.service }}
          port: {{ .Values.ingress.routes.api.backend.port }}
