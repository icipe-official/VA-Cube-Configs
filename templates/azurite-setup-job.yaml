{{- if .Values.deployments.azurite.enabled | default false }}
# Post-process setup for azurite: create the blob container the API expects
# (AZURE_BLOB_CONTAINER). Runs as a helm post-install/post-upgrade hook.
#
# Deliberately uses a dedicated stable image (images.azuriteSetup, azure-cli)
# instead of the api image: the api tag changes on every API build, which
# would make helm re-run this hook on every API release. With a stable image
# the hook only re-runs when the azurite values themselves change.
apiVersion: batch/v1
kind: Job
metadata:
  name: azurite-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: azurite-setup
          image: {{ .Values.images.azuriteSetup.repository }}:{{ .Values.images.azuriteSetup.tag }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              for i in $(seq 1 30); do
                az storage container create \
                  --name "$AZURE_BLOB_CONTAINER" \
                  --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
                  --only-show-errors && { echo "container ready: $AZURE_BLOB_CONTAINER"; exit 0; }
                echo "azurite not ready yet, retrying ($i/30)..."
                sleep 5
              done
              echo "failed to create blob container"
              exit 1
          env:
            - name: AZURE_STORAGE_CONNECTION_STRING
              value: {{ .Values.deployments.azurite.connectionString | quote }}
            - name: AZURE_BLOB_CONTAINER
              value: {{ .Values.deployments.azurite.containerName | default "vectoratlas-container" | quote }}
{{- end }}
