{{- if .Values.deployments.postgis.enabled | default false }}
# In-cluster PostGIS for the TEST environment only (prod keeps the external
# Azure PostgreSQL via secrets). Single replica + RWO volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis
  labels:
    app: postgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  strategy:
    type: Recreate # single ReadWriteOnce volume
  template:
    metadata:
      labels:
        app: postgis
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: postgis
          image: {{ .Values.images.postgis.repository }}:{{ .Values.images.postgis.tag }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.deployments.postgis.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.deployments.postgis.env.POSTGRES_PASSWORD | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.deployments.postgis.env.POSTGRES_DB | quote }}
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            # PG 18+ images expect the mount at /var/lib/postgresql (data lives
            # in a major-version-specific subdir, e.g. 18/docker) — mounting at
            # /var/lib/postgresql/data makes the image refuse to start
            - name: postgis-data
              mountPath: /var/lib/postgresql
            # base schema: applied automatically by the image entrypoint on
            # first boot of an empty volume, before postgis accepts connections
            # (so the api's run-db-migrations initContainer always runs after it)
            - name: postgis-init-sql
              mountPath: /docker-entrypoint-initdb.d/init_db.sql
              subPath: init_db.sql
      volumes:
        - name: postgis-data
          persistentVolumeClaim:
            claimName: pvc-postgis
        - name: postgis-init-sql
          configMap:
            name: postgis-init-sql
{{- end }}
