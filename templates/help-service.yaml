apiVersion: v1
kind: Service
metadata:
  name: help
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    {{- if .Values.services.help.labels }}
    {{- .Values.services.help.labels | toYaml | nindent 4 }}
    {{- end }}
  ports:
    - port: {{ .Values.services.help.port }}
      targetPort: {{ .Values.services.help.targetPort }}
  {{- if .Values.services.help.type }}
  type: {{ .Values.services.help.type }}
  {{- end }}
