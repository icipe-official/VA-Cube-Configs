apiVersion: v1
kind: Service
metadata:
  name: tileserver
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- if .Values.services.tileserver.labels }}
    {{- .Values.services.tileserver.labels | toYaml | nindent 4 }}
    {{- end }}
spec:
  selector:
    io.kompose.service: tileserver
  ports:
    - protocol: TCP
      port: {{ .Values.services.tileserver.port }}
      targetPort: {{ .Values.services.tileserver.targetPort }}
  {{- if .Values.services.tileserver.clusterIP }}
  clusterIP: {{ .Values.services.tileserver.clusterIP | quote }}
  {{- end }}
