apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name | lower }}-malariaatlas-route
  namespace: {{ .Values.global.namespace }}
spec:
  hostnames:
    - {{ .Values.ingress.routes.malariaatlas.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.ingress.gateway.name }}
      namespace: {{ .Values.ingress.gateway.namespace }}
      sectionName: {{ .Values.ingress.gateway.section }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.routes.malariaatlas.path }}
      filters:
        # Path rewrite - always applied
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .Values.ingress.routes.malariaatlas.rewritePath | quote }}
        # Host header - provider-specific
        {{- if eq .Values.ingress.gateway.provider "traefik" }}
        # Traefik: Use ExtensionRef to Middleware
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: malariaatlas-host-headers
        {{- else }}
        # Envoy/Other: Use standard urlRewrite.hostname
        - type: URLRewrite
          urlRewrite:
            hostname: data.malariaatlas.org
        {{- end }}
      backendRefs:
        - name: {{ .Values.ingress.routes.malariaatlas.backend.service }}
          port: {{ .Values.ingress.routes.malariaatlas.backend.port }}
