apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.uat.yml -c
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: tileserver
  name: tileserver
spec:
  replicas: {{ .Values.deployments.tileserver.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: tileserver
  strategy:
    type: {{ .Values.deployments.tileserver.strategy.type }}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.uat.yml -c
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: tileserver
    spec:
      containers:
        - image: {{ .Values.images.tileserver.repository }}:{{ .Values.images.tileserver.tag }}
          name: tileserver
          volumeMounts:
            - mountPath: /data
              name: tileserver-claim0
      restartPolicy: Always
      volumes:
        - name: tileserver-claim0
          persistentVolumeClaim:
            claimName: pvc-data
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
