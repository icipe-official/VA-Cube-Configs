apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.uat.yml -c
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: ui
  name: ui
spec:
  replicas: {{ .Values.deployments.ui.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: ui
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.uat.yml -c
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: ui
    spec:
      containers:
        - command:
            - node
            - server.js
          env:
            - name: TOKEN_KEY
              {{- if .Values.deployments.ui.env.TOKEN_KEY }}
              value: {{ .Values.deployments.ui.env.TOKEN_KEY | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: TOKEN_KEY_UAT
              {{- end }}
            - name: API_URL
              value: {{ .Values.deployments.ui.env.API_URL | quote }}
            - name: AUTH0_AUDIENCE
              {{- if .Values.deployments.ui.env.AUTH0_AUDIENCE }}
              value: {{ .Values.deployments.ui.env.AUTH0_AUDIENCE | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_AUDIENCE_UAT
              {{- end }}
            - name: AUTH0_BASE_URL
              {{- if .Values.deployments.ui.env.AUTH0_BASE_URL }}
              value: {{ .Values.deployments.ui.env.AUTH0_BASE_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_BASE_URL_UAT
              {{- end }}
            - name: AUTH0_CLIENT_ID
              {{- if .Values.deployments.ui.env.AUTH0_CLIENT_ID }}
              value: {{ .Values.deployments.ui.env.AUTH0_CLIENT_ID | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_CLIENT_ID_UAT
              {{- end }}
            - name: AUTH0_CLIENT_SECRET
              {{- if .Values.deployments.ui.env.AUTH0_CLIENT_SECRET }}
              value: {{ .Values.deployments.ui.env.AUTH0_CLIENT_SECRET | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_CLIENT_SECRET_UAT
              {{- end }}
            - name: AUTH0_ISSUER_BASE_URL
              {{- if .Values.deployments.ui.env.AUTH0_ISSUER_BASE_URL }}
              value: {{ .Values.deployments.ui.env.AUTH0_ISSUER_BASE_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_ISSUER_BASE_URL_UAT
              {{- end }}
            - name: AUTH0_SECRET
              {{- if .Values.deployments.ui.env.AUTH0_SECRET }}
              value: {{ .Values.deployments.ui.env.AUTH0_SECRET | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_SECRET_UAT
              {{- end }}
            - name: AUTH0_ISSUER_URL
              {{- if .Values.deployments.ui.env.AUTH0_ISSUER_URL }}
              value: {{ .Values.deployments.ui.env.AUTH0_ISSUER_URL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.name }}
                  key: AUTH0_ISSUER_URL_UAT
              {{- end }}
            - name: NEXT_PUBLIC_AUTH_ENDPOINT
              value: {{ .Values.deployments.ui.env.NEXT_PUBLIC_AUTH_ENDPOINT | quote }}
            - name: NEXT_PUBLIC_DATA_UPLOAD_CHUNK_SIZE
              value: {{ .Values.deployments.ui.env.NEXT_PUBLIC_DATA_UPLOAD_CHUNK_SIZE | quote }}
            - name: NEXT_PUBLIC_TOKEN_KEY
              {{- if .Values.deployments.ui.env.NEXT_PUBLIC_TOKEN_KEY }}
              value: {{ .Values.deployments.ui.env.NEXT_PUBLIC_TOKEN_KEY | quote }}
              {{- else }}
              value: ""
              {{- end }}
          image: {{ .Values.images.ui.repository }}:{{ .Values.images.ui.tag }}
          name: ui
      restartPolicy: Always
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ .Values.global.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
