apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- if .Values.services.redis.labels }}
    {{- .Values.services.redis.labels | toYaml | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: {{ .Values.services.redis.port }}
      targetPort: {{ .Values.services.redis.targetPort }}
      protocol: TCP
  selector:
    io.kompose.service: redis
  {{- if .Values.services.redis.type }}
  type: {{ .Values.services.redis.type }}
  {{- end }}
