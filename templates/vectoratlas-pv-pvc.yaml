# PersistentVolumeClaims

{{- if .Values.storage.pvcs.api.enabled | default false }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-api
spec:
  accessModes: {{ .Values.storage.pvcs.api.accessModes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.pvcs.api.storageSize }}
  {{- if .Values.storage.pvcs.api.storageClassName }}
  storageClassName: {{ .Values.storage.pvcs.api.storageClassName | quote }}
  {{- end }}
  {{- if .Values.storage.pvs.enabled }}
  volumeName: pv-api
  {{- end }}
{{- end }}

{{- if .Values.storage.pvcs.public.enabled | default false }}
