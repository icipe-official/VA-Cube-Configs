
{{- if .Values.storage.pvs.api.enabled | default false }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-api
spec:
  capacity:
    storage: {{ .Values.storage.pvs.api.size }}
  accessModes: {{ .Values.storage.pvs.api.accessModes | toYaml | nindent 4 }}
  {{- if .Values.storage.pvs.api.storageClassName }}
  storageClassName: {{ .Values.storage.pvs.api.storageClassName | quote }}
  {{- end }}
  hostPath:
    path: {{ .Values.storage.pvs.api.path | quote }}
  persistentVolumeReclaimPolicy: {{ .Values.storage.pvs.api.reclaimPolicy | quote }}
{{- end }}

{{- if .Values.storage.pvs.public.enabled | default false }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
