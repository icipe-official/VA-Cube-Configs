apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name | lower }}-analytics-route
  namespace: {{ .Values.global.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      namespace: {{ .Values.ingress.gateway.namespace }}
      sectionName: {{ .Values.ingress.gateway.section }}
  hostnames:
    - {{ .Values.ingress.routes.analytics.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.routes.analytics.path }}
      backendRefs:
        - name: {{ .Values.ingress.routes.analytics.backend.service }}
          port: {{ .Values.ingress.routes.analytics.backend.port }}
      timeouts:
        request: 20s
        backendRequest: 15s
