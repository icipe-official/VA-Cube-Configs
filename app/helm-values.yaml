# Test Environment Configuration
# Overrides for values.yaml
# Contains all test-specific values that were previously hardcoded in templates

global:
  namespace: vectoratlas
  secrets:
    name: uat-secrets
  imagePullSecrets:
    - name: ghcr-login-secret
  serviceAccount:
    name: azure-access-sa
# Ingress Configuration
ingress:
  gateway:
    provider: traefik
    name: vectoratlas-gateway
    namespace: vectoratlas
    section: https
  routes:
    ui:
      hostname: test.vectoratlas.icipe.org
      path: /
      stripPrefix: ""
      backend:
        service: ui
        port: 80
    analytics:
      hostname: test.vectoratlas.icipe.org
      path: /analytics
      stripPrefix: ""
      backend:
        service: analytics
        port: 3000
    api:
      hostname: test.vectoratlas.icipe.org
      path: /vector-api
      stripPrefix: /
      backend:
        service: api
        port: 3001
    help:
      hostname: test.vectoratlas.icipe.org
      path: /help
      stripPrefix: /
      backend:
        service: help
        port: 80
    ingestion:
      hostname: test.vectoratlas.icipe.org
      path: /ingestion-api
      stripPrefix: /
      backend:
        service: python-backend
        port: 8000
    tileserver:
      hostname: test.vectoratlas.icipe.org
      path: /data/
      backend:
        service: tileserver
        port: 80
    malariaatlas:
      hostname: test.vectoratlas.icipe.org
      path: /map-wms
      rewritePath: /geoserver/Interventions/wms
      backend:
        service: malariaatlas-service
        port: 443
# Service Configuration
services:
  api:
    port: 3001
    targetPort: 3001
    type: ClusterIP
    labels:
      io.kompose.service: api
  help:
    port: 80
    targetPort: 80
    type: ClusterIP
    labels:
      io.kompose.service: help
  redis:
    port: 6379
    targetPort: 6379
    type: ClusterIP
    labels:
      io.kompose.service: redis
  tileserver:
    port: 80
    targetPort: 80
    clusterIP: None
    labels:
      io.kompose.service: tileserver
      service: tileserver
  pythonBackend:
    port: 8000
    targetPort: 8000
    type: ClusterIP
    labels:
      io.kompose.service: python-backend
  analytics:
    port: 3000
    targetPort: 3000
    type: ClusterIP
    labels:
      io.kompose.service: analytics
  ui:
    port: 80
    targetPort: 3000
    type: ClusterIP
    labels:
      io.kompose.service: ui
  malariaatlas:
    externalName: data.malariaatlas.org
    port: 443
    type: ExternalName
# Storage - Local hostPath for test K3s
storage:
  pvs:
    api:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/api
      size: 10Mi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    public:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/public
      size: 10Mi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    data:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/data
      size: 1Gi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    occurrencedata:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/occurrence_data
      size: 1Gi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    postgis:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/postgis18
      size: 10Gi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
  pvcs:
    api:
      enabled: true
      storageSize: 10Mi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    public:
      enabled: true
      storageSize: 10Mi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    data:
      enabled: true
      storageSize: 1Gi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    occurrencedata:
      enabled: true
      storageSize: 1Gi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    postgis:
      enabled: true
      storageSize: 10Gi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
# Deployment Configuration
deployments:
  api:
    enabled: true
    replicaCount: 2
    strategy:
      type: RollingUpdate
    serviceAccountName: ""
    azureWorkloadIdentity: true
    env:
      # Database - in-cluster postgis (deployments.postgis), not the Azure DB
      DB_ENCRYPT_CONNECTION: "false"
      POSTGRES_DB: "mva"
      POSTGRES_HOST: "postgis"
      POSTGRES_PASSWORD: "postgrespass"
      POSTGRES_USER: "postgres"
      # External services - hardcoded test values
      ANALYTICS_API_URL: "http://analytics:3000/analytics/api"
      DATA_INGESTION_URL: "http://python-backend:8000/upload/data/v2/"
      DATA_VALIDATION_URL: "http://python-backend:8000/validate/data/v2/"
      NEXT_PUBLIC_AUTH_ENDPOINT: "http://api:3001/auth/token"
      # Redis - hardcoded test values
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # File paths - hardcoded test values
      CONFIG_FOLDER: /etc/vector-atlas/api
      OVERLAY_BLOB_FOLDER: /data/blobStore/
      PUBLIC_FOLDER: /usr/src/app/dist
      DATA_TEMPLATES_FOLDER: /usr/src/app/dist/public/templates
      TILESERVER_DATA_FOLDER: /data/
      FULL_OCCURRENCE_DATA_FOLDER: /occurrence_data
      OCC_GEO_JOB_DIR: /usr/src/OccurrenceGeoJob # embedded in the api image; spawned on demand to regenerate the full occurrence data
      SENT_EMAIL_FOLDER: ""
      TEMP_DIR: ""
      # Auth
      ANALYTICS_ADMIN_PASSWORD: ""
      NEXT_PUBLIC_ANALYTICS_ID: "1a94f11a-0a78-4b4a-9146-0d4d5758610e"
      TOKEN_KEY: ""
      # Auth0
      AUTH0_AUDIENCE: ""
      AUTH0_CLIENT_ID: ""
      AUTH0_CLIENT_SECRET: ""
      AUTH0_ISSUER_URL: ""
      # Azure - test uses the in-cluster azurite emulator (see deployments.azurite)
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      # Base URL
      BASE_URL: ""
      # Datacite
      DATACITE_PASSWORD: ""
      DATACITE_PREFIX: ""
      DATACITE_URL: ""
      DATACITE_USER: ""
      # DOI
      DOI_ENVIRONMENT: ""
      DOI_PUBLISHER: ""
      DOI_RESOLVER_BASE_URL: ""
      # Email
      EMAIL_FROM: ""
      EMAIL_HOST: ""
      EMAIL_PASSWORD: ""
      EMAIL_PORT: ""
      EMAIL_SECURE: ""
      # IMAP
      IMAP_PORT: ""
      IMAP_SERVER: ""
      # File storage - Azure (azurite) in test; browsers never talk to blob
      # storage directly: uploads go through the API and export downloads are
      # proxied (EXPORT_USE_PROXY_DOWNLOAD=true), so SAS URLs must stay off
      # (they would point at the in-cluster azurite service)
      FILE_STORAGE_TYPE: "Azure"
      # Export Configuration
      DATA_EXPORT_BATCH_SIZE: "500"
      DATA_EXPORT_YIELD_AFTER: "2"
      EXPORT_USE_SAS_URLS: "false"
      EXPORT_SAS_URL_TTL_MINUTES: "120"
      EXPORT_USE_PROXY_DOWNLOAD: "true"
      EXPORT_DOWNLOAD_BASE_URL: "https://test.vectoratlas.icipe.org/vector-api"
    volumes:
      - name: api-claim0
        pvcName: pvc-public
        mountPath: /usr/src/app/dist/public
      - name: api-claim1
        pvcName: pvc-api
        mountPath: /etc/vector-atlas/api
      - name: api-claim2
        pvcName: pvc-data
        mountPath: /data
      - name: occurrencegeojob-claim
        pvcName: pvc-occurrencedata
        mountPath: /occurrence_data
    initContainers:
      dbMigrations:
        image: ""
        command: ["npm", "run", "migrations:runallprod"]
  pythonBackend:
    enabled: true
    replicaCount: 1
    env:
      POSTGRES_DB: "mva"
      POSTGRES_HOST: "postgis"
      POSTGRES_PASSWORD: "postgrespass"
      POSTGRES_USER: "postgres"
      POSTGRES_PORT: "5432"
  ui:
    enabled: true
    replicaCount: 2
    env:
      TOKEN_KEY: ""
      API_URL: "api"
      NEXT_PUBLIC_AUTH_ENDPOINT: "http://api:3001/auth/token"
      NEXT_PUBLIC_DATA_UPLOAD_CHUNK_SIZE: "500"
      NEXT_PUBLIC_TOKEN_KEY: ""
      AUTH0_AUDIENCE: ""
      AUTH0_BASE_URL: ""
      AUTH0_CLIENT_ID: ""
      AUTH0_CLIENT_SECRET: ""
      AUTH0_ISSUER_BASE_URL: ""
      AUTH0_SECRET: ""
      AUTH0_ISSUER_URL: ""
  analytics:
    enabled: true
    replicaCount: 1
    containerPort: 3000
    env:
      BASE_PATH: /analytics
      CLIENT_IP_HEADER: x-original-ip
      DATABASE_TYPE: postgresql
      DATABASE_URL: ""
  tileserver:
    enabled: true
    replicaCount: 1
    strategy:
      type: Recreate
    volumes:
      - name: tileserver-claim0
        pvcName: pvc-data
        mountPath: /data
  redis:
    enabled: true
    replicaCount: 1
    strategy:
      type: Recreate
  help:
    enabled: true
    replicaCount: 1
    command: ["nginx", "-g", "daemon off;"]
  # Azurite (Azure Blob Storage emulator) - test environment only, because the
  # real Azure blob endpoint is not reachable from browsers on
  # test.vectoratlas.icipe.org. Export downloads are proxied by the API
  # (EXPORT_USE_PROXY_DOWNLOAD=true, EXPORT_USE_SAS_URLS=false) and uploads go
  # through the API, so only in-cluster access to blob storage is needed.
  # The OccurrenceGeoJob is no longer deployed separately: it is embedded in
  # the api image and spawned on demand (OCC_GEO_JOB_DIR).
  azurite:
    enabled: true
    replicaCount: 1
    connectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    containerName: vectoratlas-container
  # In-cluster PostGIS for the test environment: replaces the remote Azure
  # PostgreSQL (which is slow for bulk deletes and not disposable). The
  # postgis-init hook Job applies files/init_db.sql; the api initContainer
  # runs the TypeORM migrations on top.
  postgis:
    enabled: true
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: mva
# Image Configuration
images:
  api:
    repository: ghcr.io/icipe-official/api
    tag: "test-bd8c6471"
  dbMigrations:
    repository: ghcr.io/icipe-official/db-migrations
    tag: latest
  help:
    repository: ghcr.io/icipe-official/help
    tag: test-abc7be3f
  ingestionapi:
    repository: ghcr.io/icipe-official/ingestionapi
    tag: "test-0387127c"
  tileserver:
    repository: ghcr.io/icipe-official/tileserver
    tag: 070e96a5
  ui:
    repository: ghcr.io/icipe-official/ui
    tag: "test-0387127c"
  umami:
    repository: ghcr.io/icipe-official/docker-umami
    tag: test-c68d87ce
  nginx:
    repository: nginx
    tag: eb6a603f
  azurite:
    repository: mcr.microsoft.com/azure-storage/azurite
    tag: "latest"
  azuriteSetup:
    repository: mcr.microsoft.com/azure-cli
    tag: "latest"
  postgis:
    repository: docker.io/postgis/postgis
    tag: "18-master"
  redis:
    repository: redis
    tag: "7"
# Workload Identity Webhook
workload-identity-webhook:
  enabled: false
  azureTenantID: "dummy"
  azureTenantIDFromSecret:
    name: azure-workload-identity
    key: azure-tenant-id
