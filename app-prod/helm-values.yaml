# Production Environment Configuration
# Overrides for values.yaml
# Disable PVs (use cloud storage classes) and adjust sizes for production

global:
  namespace: vectoratlas
  secrets:
    name: uat-secrets
  imagePullSecrets:
    - name: ghcr-login-secret
  serviceAccount:
    name: ""
# Ingress Configuration
ingress:
  gateway:
    provider: envoy
    name: envoy-gateway
    namespace: default
    section: https
  routes:
    ui:
      hostname: 134.112.16.22.nip.io
      path: /
      stripPrefix: ""
      backend:
        service: ui
        port: 80
    api:
      hostname: 134.112.16.22.nip.io
      path: /vector-api
      stripPrefix: /
      backend:
        service: api
        port: 3001
    help:
      hostname: 134.112.16.22.nip.io
      path: /help
      stripPrefix: /
      backend:
        service: help
        port: 80
    ingestion:
      hostname: 134.112.16.22.nip.io
      path: /ingestion-api
      stripPrefix: /
      backend:
        service: python-backend
        port: 8000
    tileserver:
      hostname: 134.112.16.22.nip.io
      path: /data/
      backend:
        service: tileserver
        port: 80
    malariaatlas:
      hostname: 134.112.16.22.nip.io
      path: /map-wms
      rewritePath: /geoserver/Interventions/wms
      backend:
        service: malariaatlas-service
        port: 443
# Service Configuration
services:
  api:
    port: 3001
    targetPort: 3001
    type: ClusterIP
    labels:
      io.kompose.service: api
  help:
    port: 80
    targetPort: 80
    type: ClusterIP
    labels:
      io.kompose.service: help
  redis:
    port: 6379
    targetPort: 6379
    type: ClusterIP
    labels:
      io.kompose.service: redis
  tileserver:
    port: 80
    targetPort: 80
    clusterIP: None
    labels:
      io.kompose.service: tileserver
      service: tileserver
  pythonBackend:
    port: 8000
    targetPort: 8000
    type: ClusterIP
    labels:
      io.kompose.service: python-backend
  analytics:
    port: 3000
    targetPort: 3000
    type: ClusterIP
    labels:
      io.kompose.service: analytics
  ui:
    port: 80
    targetPort: 3000
    type: ClusterIP
    labels:
      io.kompose.service: ui
  malariaatlas:
    externalName: data.malariaatlas.org
    port: 443
    type: ExternalName
# Storage - Cloud-managed (PVs disabled, PVCs use storageClass)
storage:
  pvs:
    api:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/api
      size: 10Mi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    public:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/public
      size: 10Mi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    data:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/data
      size: 1Gi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
    occurrencedata:
      enabled: true
      path: /opt/dmmg-kubernetes-test/vectoratlas/occurrence_data
      size: 1Gi
      accessModes: [ReadWriteOnce]
      reclaimPolicy: Retain
      storageClassName: ""
  pvcs:
    api:
      enabled: true
      storageSize: 10Mi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    public:
      enabled: true
      storageSize: 10Mi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    data:
      enabled: true
      storageSize: 1Gi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
    occurrencedata:
      enabled: true
      storageSize: 1Gi
      accessModes: [ReadWriteOnce]
      storageClassName: ""
# Deployment Configuration - Production may have different replica counts
deployments:
  api:
    enabled: true
    replicaCount: 2
    strategy:
      type: RollingUpdate
    serviceAccountName: ""
    azureWorkloadIdentity: false
    env:
      DB_ENCRYPT_CONNECTION: "false"
      POSTGRES_DB: ""
      POSTGRES_HOST: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
      ANALYTICS_API_URL: "http://analytics:3000/api"
      DATA_INGESTION_URL: "http://python-backend:8000/upload/data/v2/"
      DATA_VALIDATION_URL: "http://python-backend:8000/validate/data/v2/"
      NEXT_PUBLIC_AUTH_ENDPOINT: "http://api:3001/auth/token"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CONFIG_FOLDER: /etc/vector-atlas/api
      OVERLAY_BLOB_FOLDER: /data/blobStore/
      PUBLIC_FOLDER: /usr/src/app/dist
      DATA_TEMPLATES_FOLDER: /usr/src/app/dist/public/templates
      TILESERVER_DATA_FOLDER: /data/
      FULL_OCCURRENCE_DATA_FOLDER: /occurrence_data
      SENT_EMAIL_FOLDER: ""
      TEMP_DIR: ""
      ANALYTICS_ADMIN_PASSWORD: ""
      NEXT_PUBLIC_ANALYTICS_ID: "a922a311-fba3-4cc3-b707-94e0d203e0f1"
      TOKEN_KEY: ""
      AUTH0_AUDIENCE: ""
      AUTH0_CLIENT_ID: ""
      AUTH0_CLIENT_SECRET: ""
      AUTH0_ISSUER_URL: ""
      AZURE_STORAGE_CONNECTION_STRING: ""
      BASE_URL: ""
      DATACITE_PASSWORD: ""
      DATACITE_PREFIX: ""
      DATACITE_URL: ""
      DATACITE_USER: ""
      DOI_ENVIRONMENT: ""
      DOI_PUBLISHER: ""
      DOI_RESOLVER_BASE_URL: ""
      EMAIL_FROM: ""
      EMAIL_HOST: ""
      EMAIL_PASSWORD: ""
      EMAIL_PORT: ""
      EMAIL_SECURE: ""
      IMAP_PORT: ""
      IMAP_SERVER: ""
      FILE_STORAGE_TYPE: ""
    volumes:
      - name: api-claim0
        pvcName: pvc-public
        mountPath: /usr/src/app/dist/public
      - name: api-claim1
        pvcName: pvc-api
        mountPath: /etc/vector-atlas/api
      - name: api-claim2
        pvcName: pvc-data
        mountPath: /data
      - name: occurrencegeojob-claim
        pvcName: pvc-occurrencedata
        mountPath: /occurrence_data
    initContainers:
      dbMigrations:
        image: ""
        command: ["npm", "run", "migrations:runallprod"]
  pythonBackend:
    enabled: true
    replicaCount: 1
    env:
      POSTGRES_DB: ""
      POSTGRES_HOST: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
      POSTGRES_PORT: "5432"
  ui:
    enabled: true
    replicaCount: 2
    env:
      TOKEN_KEY: ""
      API_URL: "api"
      NEXT_PUBLIC_AUTH_ENDPOINT: "http://api:3001/auth/token"
      NEXT_PUBLIC_DATA_UPLOAD_CHUNK_SIZE: "500"
      NEXT_PUBLIC_TOKEN_KEY: ""
      AUTH0_AUDIENCE: ""
      AUTH0_BASE_URL: ""
      AUTH0_CLIENT_ID: ""
      AUTH0_CLIENT_SECRET: ""
      AUTH0_ISSUER_BASE_URL: ""
      AUTH0_SECRET: ""
      AUTH0_ISSUER_URL: ""
  analytics:
    enabled: true
    replicaCount: 1
    containerPort: 3000
    env:
      BASE_PATH: /analytics
      CLIENT_IP_HEADER: x-original-ip
      DATABASE_TYPE: postgresql
      DATABASE_URL: ""
  tileserver:
    enabled: true
    replicaCount: 1
    strategy:
      type: Recreate
    volumes:
      - name: tileserver-claim0
        pvcName: pvc-data
        mountPath: /data
  redis:
    enabled: true
    replicaCount: 1
    strategy:
      type: Recreate
  help:
    enabled: true
    replicaCount: 1
    command: ["nginx", "-g", "daemon off;"]
  occurrencegeojob:
    enabled: true
    backoffLimit: 4
    restartPolicy: OnFailure
    securityContext:
      runAsUser: 0
    env:
      PGDATABASE: ""
      PGHOST: ""
      PGPASSWORD: ""
      PGUSER: ""
      PGPORT: "5432"
      LOGGER_LEVEL: info # Less verbose in production
      LOGGER_OUTPUT: console
      TARGET_DIRECTORY: /home/app/app/.tmp
      STAGING_DIRECTORY: /home/app/app/.tmp/staging
    volumes:
      - name: occurrencegeojob-volume
        pvcName: pvc-occurrencedata
        mountPath: /home/app/app/.tmp
# Image Configuration - Production may use different tags
images:
  api:
    repository: ghcr.io/icipe-official/api
    tag: "production-af775283" # Should be updated to production tag
  dbMigrations:
    repository: ghcr.io/icipe-official/db-migrations
    tag: latest
  help:
    repository: ghcr.io/icipe-official/help
    tag: production-af775283
  ingestionapi:
    repository: ghcr.io/icipe-official/ingestionapi
    tag: "production-af775283" # Should be updated to production tag
  tileserver:
    repository: ghcr.io/icipe-official/tileserver
    tag: 070e96a5
  ui:
    repository: ghcr.io/icipe-official/ui
    tag: "production-af775283" # Should be updated to production tag
  umami:
    repository: ghcr.io/umami-software/umami
    tag: postgresql-v1.40
  nginx:
    repository: nginx
    tag: eb6a603f
  occurrencegeojob:
    repository: ghcr.io/icipe-official/occurrencegeojob
    tag: production-af775283 # Should be updated to production tag
  redis:
    repository: redis
    tag: "7"
# Workload Identity Webhook - Production Azure tenant
workload-identity-webhook:
  enabled: false
  azureTenantID: "dummy" # Replace with production Azure tenant ID
  azureTenantIDFromSecret:
    name: azure-workload-identity
    key: azure-tenant-id
