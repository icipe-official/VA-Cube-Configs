---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vectoratlas-prod
  namespace: argocd
spec:
  destination:
    namespace: vectoratlas
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      releaseName: vectoratlas-prod
      valueFiles: ["app-prod/values-prod.yaml"]
    path: "."
    repoURL: https://github.com/icipe-official/VA-Cube-Configs
    targetRevision: main
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
